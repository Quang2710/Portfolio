<a class="skip-link" href="#main">{{ t(ui.skip) }}</a>

<header
  class="bar"
  [class.is-scrolled]="scrolled() || menuOpen()"
  [class.is-hidden]="hidden()"
>
  <div class="container bar-inner">
    <a class="brand" href="#top" (click)="closeMenu()" [attr.aria-label]="t(profile.name)">vnquang</a>

    <nav class="nav" [attr.aria-label]="t(ui.header.nav)">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              [class.is-active]="active() === link.id"
              [attr.aria-current]="active() === link.id ? 'location' : null"
              >{{ t(link.label) }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="tools">
      <div class="lang" role="group" [attr.aria-label]="t(ui.header.language)">
        <button type="button" [attr.aria-pressed]="i18n.lang() === 'en'" (click)="i18n.use('en')">
          EN
        </button>
        <button type="button" [attr.aria-pressed]="i18n.lang() === 'vi'" (click)="i18n.use('vi')">
          VI
        </button>
      </div>

      <button
        type="button"
        class="icon-btn theme-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="t(theme.theme() === 'dark' ? ui.header.toLight : ui.header.toDark)"
      >
        @if (theme.theme() === 'dark') {
          <app-icon name="sun" [size]="18" />
        } @else {
          <app-icon name="moon" [size]="18" />
        }
      </button>

      <button
        type="button"
        class="icon-btn menu-btn"
        (click)="toggleMenu()"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="t(menuOpen() ? ui.header.closeMenu : ui.header.openMenu)"
      >
        <span class="burger" [class.is-open]="menuOpen()" aria-hidden="true">
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>
</header>

<div id="mobile-menu" class="sheet" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <nav class="container sheet-nav" [attr.aria-label]="t(ui.header.nav)">
    @for (link of links; track link.id; let i = $index) {
      <a [href]="'#' + link.id" [style.--i]="i" (click)="closeMenu()">{{ t(link.label) }}</a>
    }
  </nav>
  <div class="container sheet-foot">
    <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    <a [href]="profile.phoneHref">{{ profile.phone }}</a>
  </div>
</div>
