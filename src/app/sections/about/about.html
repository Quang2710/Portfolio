<section class="section" id="about">
  <div class="container section-grid">
    <h2 class="section-label">{{ t(ui.nav.about) }}</h2>

    <div class="about">
      <p class="lead" appReveal>{{ t(lead) }}</p>
      <p class="body" appReveal="80">{{ t(ui.about.body) }}</p>

      <dl class="facts" appReveal="160">
        <div>
          <dt>{{ t(ui.about.education) }}</dt>
          <dd>{{ t(profile.education) }}</dd>
        </div>
        <div>
          <dt>{{ t(ui.about.offTheClock) }}</dt>
          <dd>{{ t(profile.hobbies) }}</dd>
        </div>
      </dl>
    </div>
  </div>
</section>
